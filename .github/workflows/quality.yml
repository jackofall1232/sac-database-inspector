name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - '1.1.0'

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer lint

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production distribution
        run: bin/build-dist.sh
      - name: Verify development files are excluded from the artifact
        run: |
          cd build/sac-database-inspector
          for forbidden in .github .gitignore .distignore .wordpress-org tests docs bin vendor node_modules phpcs.xml.dist phpunit.xml.dist composer.json composer.lock README.md; do
            if [ -e "$forbidden" ]; then
              echo "Forbidden development file shipped in distribution: $forbidden"
              exit 1
            fi
          done
          for required in sac-database-inspector.php uninstall.php readme.txt includes assets languages; do
            if [ ! -e "$required" ]; then
              echo "Required runtime file missing from distribution: $required"
              exit 1
            fi
          done
      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: sac-database-inspector-zip
          path: build/sac-database-inspector.zip
      # plugin-check-action@v1 only distinguishes 'trunk' from everything else;
      # any other wp-version value makes wp-env install the latest stable
      # WordPress release. 'latest' states that honestly. It is 7.1 as of the
      # 1.1.2 release, matching "Tested up to" in readme.txt.
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/sac-database-inspector
          wp-version: 'latest'
          strict: true
